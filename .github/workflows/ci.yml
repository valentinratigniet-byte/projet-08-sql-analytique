name: CI

on:
  push:
  pull_request:

jobs:
  run-queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: projet-08

      - name: Récupérer la base du Projet 07
        uses: actions/checkout@v4
        with:
          repository: valentinratigniet-byte/projet-07-base-ecommerce
          path: projet-07

      - name: Démarrer PostgreSQL (Projet 07)
        working-directory: projet-07
        run: docker compose up -d

      - name: Attendre que la base soit prête
        run: |
          for i in $(seq 1 20); do
            docker exec p07_ecommerce_db pg_isready -U portfolio -d ecommerce && exit 0
            sleep 2
          done
          echo "Postgres jamais devenu ready" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Peupler la base (Faker)
        working-directory: projet-07
        run: |
          pip install -r seed/requirements.txt
          python seed/seed.py

      - name: Exécuter les 5 fichiers de requêtes (doivent tourner sans erreur)
        working-directory: projet-08
        run: |
          for f in queries/*.sql; do
            echo "== $f =="
            docker exec -i p07_ecommerce_db psql -U portfolio -d ecommerce -v ON_ERROR_STOP=1 < "$f" > /dev/null
          done
